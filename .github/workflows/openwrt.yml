name: Build OpenWrt and Docker Image

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-23.05
  CONFIG_FILE: .config
  DIY_P1_SH: op1.sh
  DIY_P2_SH: op2.sh
  DIY_P3_SH: op3.sh
  TZ: Asia/Shanghai
  DOCKER_IMAGE_NAME: mcgtekwrt/openwrt-onecloud
  GHCR_IMAGE_NAME: ghcr.io/upleung/openwrt-onecloud

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"


    - name: Clone source code
      run: git clone -b $REPO_BRANCH $REPO_URL openwrt

    - name: Run DIY part 1 script
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        ../$DIY_P1_SH

    - name: Update and install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Run DIY part 2 and 3 scripts
      run: |
        chmod +x $DIY_P2_SH $DIY_P3_SH
        cd openwrt
        ../$DIY_P2_SH
        ../$DIY_P3_SH

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        cd openwrt
        make defconfig

    - name: Download package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Organize firmware files
      id: organize
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: Upload firmware to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        tag_name: "v23.05.6-${{ github.run_number }}"
        files: ${{ env.FIRMWARE }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU for Docker
      uses: docker/setup-qemu-action@v3
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: mcgtekwrt
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: upleung
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      run: |
        # 复制 rootfs 和 Dockerfile 到构建目录[cite: 1]
        cp docker/Dockerfile ${{ env.FIRMWARE }}/
        cd ${{ env.FIRMWARE }}
        
        # 推送 mcgtekwrt/openwrt-onecloud (DockerHub)[cite: 1]
        docker buildx build --platform linux/arm/v7 \
          -t ${{ env.DOCKER_IMAGE_NAME }}:latest \
          -t ${{ env.DOCKER_IMAGE_NAME }}:23.05.6 \
          --push .
          
        # 推送 ghcr.io/upleung/openwrt-onecloud (GitHub Packages)[cite: 1]
        docker buildx build --platform linux/arm/v7 \
          -t ${{ env.GHCR_IMAGE_NAME }}:latest \
          -t ${{ env.GHCR_IMAGE_NAME }}:23.05.6 \
          --push .
